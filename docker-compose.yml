# Local research demo. See README for indexing before the first query.
services:
  qdrant:
    image: qdrant/qdrant:v1.17.0
    ports:
      - "127.0.0.1:6333:6333"
    volumes:
      - qdrant_data:/qdrant/storage
    healthcheck:
      test: ["CMD-SHELL", "bash -c 'cat < /dev/null > /dev/tcp/localhost/6333'"]
      interval: 10s
      timeout: 5s
      retries: 5
  backend:
    build: .
    ports:
      - "127.0.0.1:8000:8000"
    env_file: .env
    environment:
      QDRANT_URL: http://qdrant:6333
      QDRANT_COLLECTION: ${QDRANT_COLLECTION:-medrag_demo}
      MEDRAG_DATA_DIR: /app/runtime
    volumes:
      - checkpoints:/app/runtime
      - model_cache:/root/.cache/huggingface
    depends_on:
      qdrant:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/api/live"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 90s
  frontend:
    build: ./frontend
    ports:
      - "127.0.0.1:5173:80"
    depends_on:
      backend:
        condition: service_healthy
volumes:
  qdrant_data:
  checkpoints:
  model_cache:
