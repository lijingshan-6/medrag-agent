# docker compose -f docker-compose.yml -f compose.ollama.yml up -d --build
# Then: docker compose -f docker-compose.yml -f compose.ollama.yml exec ollama ollama pull qwen3.5:9b
services:
  ollama:
    image: ollama/ollama:0.6.8
    volumes:
      - ollama_data:/root/.ollama
    healthcheck:
      test: ["CMD", "ollama", "list"]
      interval: 10s
      timeout: 5s
      retries: 12
  backend:
    environment:
      LLM_BACKEND: ollama
      OLLAMA_HOST: http://ollama:11434
      OLLAMA_MODEL: qwen3.5:9b
    depends_on:
      ollama:
        condition: service_healthy
volumes:
  ollama_data:
