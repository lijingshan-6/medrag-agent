[build-system]
requires = ["setuptools>=61", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "medrag-agent"
version = "0.1.0"
description = "VeritasMed medical literature RAG agent — install deps with pip install -e ."
readme = "README.md"
requires-python = ">=3.12,<3.13"
dependencies = [
  # ── ML / retrieval (runtime) ─────────────────────────────────────────────
  "torch==2.6.0",
  "numpy>=1.26,<3",
  "transformers>=4.57.3,<5",
  "sentence-transformers>=5.4.1,<6",   # app.py preload; BGEReranker cross-encoder
  "FlagEmbedding==1.4.0",             # BGEM3Embedder; scripts/04_build_index
  "qdrant-client==1.17.1",
  # ── LangGraph agent + LLM ──────────────────────────────────────────────────
  "langgraph==1.2.1",
  "langgraph-checkpoint-sqlite==3.0.3",
  "langchain-core>=1.4,<2",
  "langchain-openai>=1.2.1,<2",
  "langchain-ollama>=1.1,<2",          # LLM_BACKEND=ollama; HyDE / multi-query retrievers
  "openai>=2.36,<3",                   # eval scripts judge client
  # ── API + MCP ─────────────────────────────────────────────────────────────
  "fastapi>=0.115.6,<1",
  "uvicorn[standard]>=0.30",
  "fastmcp>=3.2.4,<4",
  "pydantic>=2.7",
  "pyarrow>=15.0",                  # Windows import-order guard (MCP / scripts)
  # ── Ingest + utilities ─────────────────────────────────────────────────────
  "biopython>=1.84",                # PubMed / PMC Entrez
  "httpx>=0.27",
  "tenacity>=9.0",
  "python-dotenv>=1.2,<2",
  "tqdm>=4.66",
]

[project.optional-dependencies]
dev = [
  "ruff",
  "pytest",
]

[tool.ruff]
line-length = 100

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff.lint]
# Keep the release gate on Ruff's stable default rule families. Ruff 0.16
# otherwise expands selection when a lint table is present, which made the
# locked CI environment disagree with the previously used Ruff 0.9 behavior.
select = ["E4", "E7", "E9", "F"]

[tool.ruff.lint.per-file-ignores]
# These modules deliberately load native runtimes/env before downstream imports.
"src/medrag/api/app.py" = ["E402"]
"src/medrag/mcp_server/server.py" = ["E402"]

[tool.pytest.ini_options]
testpaths = ["tests"]
